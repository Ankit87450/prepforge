version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prepforge
      POSTGRES_USER: prepforge
      POSTGRES_PASSWORD: prepforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             gunicorn prepforge.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DATABASE_URL: postgres://prepforge:prepforge@db:5432/prepforge
      SECRET_KEY: change-me-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - db

volumes:
  pgdata:
